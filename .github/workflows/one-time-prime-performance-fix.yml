name: One-time PRIME checkout performance repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-prime-performance-fix.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch checkout MID and remove DOM runtime patch
        shell: python
        run: |
          from pathlib import Path

          checkout = Path('src/pages/shop/checkout-hardened-v3.tsx')
          text = checkout.read_text()
          old = '''  // Derive Prime Member ID\n  const primeMid = customer?.telegramUserId\n    ? `PC${customer.telegramUserId.slice(0, 8).toUpperCase()}`\n    : "PC-GUEST";'''
          new = '''  // PRIME Member ID is always the server-hydrated customer identity.\n  // Never derive or synthesize an MID from the Telegram User ID.\n  const hydratedPrimeMid = String(customer?.primeMemberId || "").trim().toUpperCase();\n  const primeMid = /^[A-Z0-9]{10}$/.test(hydratedPrimeMid) && !/^PC[A-Z0-9]{8}$/.test(hydratedPrimeMid)\n    ? hydratedPrimeMid\n    : "";'''
          if old not in text:
              raise SystemExit('Expected legacy checkout MID generator was not found')
          checkout.write_text(text.replace(old, new))

          app = Path('src/App.tsx')
          app_text = app.read_text()
          app_text = app_text.replace('import CheckoutRuntimePatch from "./components/CheckoutRuntimePatch.tsx";\n', '')
          app_text = app_text.replace('        <CheckoutRuntimePatch />\n', '')
          app.write_text(app_text)

          runtime = Path('src/components/CheckoutRuntimePatch.tsx')
          if runtime.exists():
              runtime.unlink()

          workflow = Path('.github/workflows/one-time-prime-performance-fix.yml')
          workflow.unlink()

      - name: Commit repaired checkout
        shell: bash
        run: |
          git config user.name "CODESPACE"
          git config user.email "jerome.businessplatform@gmail.com"
          git add src/pages/shop/checkout-hardened-v3.tsx src/App.tsx src/components/CheckoutRuntimePatch.tsx .github/workflows/one-time-prime-performance-fix.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: remove legacy checkout MID generator and DOM polling"
          git push origin HEAD:main
